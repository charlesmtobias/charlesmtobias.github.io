<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f4f0;
      --bg-tertiary: #efefec;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #a0a09c;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --blue: #378ADD;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --teal: #1D9E75;
      --teal-bg: #E1F5EE;
      --teal-text: #085041;
      --amber-bg: #FAEEDA;
      --amber-text: #633806;
      --coral: #D85A30;
      --coral-bg: #FAECE7;
      --coral-text: #712B13;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #2a2a27;
        --bg-tertiary: #222220;
        --text-primary: #f0efe8;
        --text-secondary: #9a9a94;
        --text-tertiary: #666660;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.2);
        --blue-bg: #0c2a4a;
        --blue-text: #85B7EB;
        --teal-bg: #072e20;
        --teal-text: #5DCAA5;
        --amber-bg: #3a2408;
        --amber-text: #FAC775;
        --coral-bg: #3a1a0c;
        --coral-text: #F0997B;
      }
    }

    html, body {
      min-height: 100%;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
      letter-spacing: -0.3px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: 1.25rem;
    }

    .tab {
      flex: 1;
      padding: 9px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: calc(var(--radius-lg) - 2px);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab.active {
      background: var(--bg);
      color: var(--text-primary);
      border: 0.5px solid var(--border);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Timer Card */
    .timer-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .phase-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .phase-work  { background: var(--blue-bg);  color: var(--blue-text); }
    .phase-break { background: var(--teal-bg);  color: var(--teal-text); }

    .ring-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 1.25rem;
    }

    .ring-wrap svg { transform: rotate(-90deg); }

    .time-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 500;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .phase-label {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn {
      padding: 10px 22px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid var(--border-md);
      background: transparent;
      color: var(--text-primary);
      transition: background 0.12s, opacity 0.12s;
    }

    .btn:hover { background: var(--bg-secondary); }

    .btn.primary {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }

    .btn.primary:hover { opacity: 0.82; }

    .cycle-info {
      margin-top: 1.25rem;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }

    .dot.filled { background: var(--blue); }

    /* Schedule */
    .sched-header {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .current-phase-name {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .current-time-remaining {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .progress-bar-wrap {
      margin-top: 12px;
      background: var(--bg-secondary);
      border-radius: 4px;
      height: 5px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 30s linear;
    }

    .next-up {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 10px;
    }

    .sched-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sched-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 0.5px solid transparent;
      transition: all 0.2s;
    }

    .sched-row.s-active {
      background: var(--bg);
      border-color: var(--border-md);
    }

    .sched-row.s-past { opacity: 0.38; }

    .sched-time {
      font-size: 12px;
      color: var(--text-tertiary);
      min-width: 84px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .sched-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
    }

    .sched-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .tag-work   { background: var(--blue-bg);   color: var(--blue-text); }
    .tag-break  { background: var(--teal-bg);   color: var(--teal-text); }
    .tag-warmup { background: var(--amber-bg);  color: var(--amber-text); }
    .tag-lunch  { background: var(--coral-bg);  color: var(--coral-text); }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.65); }
    }

    @media (max-width: 480px) {
      .time-display { font-size: 38px; }
      .controls { flex-wrap: wrap; }
      .btn { padding: 9px 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="app">
      <h1>Focus Timer</h1>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('timer')">90/30 Timer</button>
        <button class="tab" onclick="switchTab('schedule')">Daily Schedule</button>
      </div>

      <!-- Timer Panel -->
      <div id="timer-panel" class="panel active">
        <div class="timer-card">
          <div class="phase-badge phase-work" id="t-badge">FOCUS</div>
          <div class="ring-wrap">
            <svg width="200" height="200" viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="88" fill="none" stroke="var(--border)" stroke-width="7"/>
              <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="#378ADD"
                stroke-width="7" stroke-linecap="round"
                stroke-dasharray="553" stroke-dashoffset="0"
                style="transition: stroke-dashoffset 1s linear, stroke 0.4s;"/>
            </svg>
            <div class="time-display" id="t-time">90:00</div>
          </div>
          <div class="phase-label" id="t-label">Focus Block</div>
          <div class="controls">
            <button class="btn" onclick="resetTimer()">Reset</button>
            <button class="btn primary" id="t-btn" onclick="toggleTimer()">Start</button>
            <button class="btn" onclick="skipPhase()">Skip</button>
          </div>
          <div class="cycle-info">
            <span id="cycle-count">Cycle 1</span>
            <div class="dots">
              <div class="dot filled" id="d0"></div>
              <div class="dot" id="d1"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Schedule Panel -->
      <div id="schedule-panel" class="panel">
        <div class="sched-header" id="sched-header"></div>
        <div class="sched-list" id="sched-list"></div>
      </div>
    </div>
  </div>

  <script>
    /* ── Timer ── */
    const CIRCUMFERENCE = 2 * Math.PI * 88;

    const PHASES = [
      { name: "Focus Block", duration: 90 * 60, type: "work" },
      { name: "Break",       duration: 30 * 60, type: "break" }
    ];

    let current = 0, remaining = PHASES[0].duration;
    let running = false, timerInterval = null, cycles = 0;

    function fmt(s) {
      return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    }

    function updateTimer() {
      const p = PHASES[current];
      const offset = CIRCUMFERENCE * (1 - remaining / p.duration);
      const ring = document.getElementById('ring');
      ring.style.strokeDashoffset = offset;
      ring.style.stroke = p.type === 'work' ? '#378ADD' : '#1D9E75';
      document.getElementById('t-time').textContent = fmt(remaining);
      const badge = document.getElementById('t-badge');
      badge.textContent = p.type === 'work' ? 'FOCUS' : 'BREAK';
      badge.className = 'phase-badge ' + (p.type === 'work' ? 'phase-work' : 'phase-break');
      document.getElementById('t-label').textContent = p.name;
      document.getElementById('d0').className = 'dot' + (current === 0 ? ' filled' : '');
      document.getElementById('d1').className = 'dot' + (current === 1 ? ' filled' : '');
      document.getElementById('cycle-count').textContent = 'Cycle ' + (cycles + 1);
      document.title = fmt(remaining) + ' — ' + p.name;
    }

    function tick() {
      if (remaining > 0) {
        remaining--;
        updateTimer();
      } else {
        current = (current + 1) % PHASES.length;
        if (current === 0) cycles++;
        remaining = PHASES[current].duration;
        updateTimer();
      }
    }

    function toggleTimer() {
      if (running) {
        clearInterval(timerInterval);
        running = false;
        document.getElementById('t-btn').textContent = 'Resume';
      } else {
        timerInterval = setInterval(tick, 1000);
        running = true;
        document.getElementById('t-btn').textContent = 'Pause';
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      running = false; current = 0; cycles = 0;
      remaining = PHASES[0].duration;
      document.getElementById('t-btn').textContent = 'Start';
      updateTimer();
    }

    function skipPhase() {
      current = (current + 1) % PHASES.length;
      if (current === 0) cycles++;
      remaining = PHASES[current].duration;
      updateTimer();
    }

    updateTimer();

    /* ── Schedule ── */
    const SCHEDULE = [
      { name: "Warm Up", start: [9,0],   end: [9,30],  type: "warmup" },
      { name: "Block 1", start: [9,30],  end: [11,0],  type: "work"   },
      { name: "Break",   start: [11,0],  end: [11,30], type: "break"  },
      { name: "Block 2", start: [11,30], end: [13,0],  type: "work"   },
      { name: "Lunch",   start: [13,0],  end: [14,0],  type: "lunch"  },
      { name: "Block 3", start: [14,0],  end: [15,30], type: "work"   },
      { name: "Break",   start: [15,30], end: [16,0],  type: "break"  },
      { name: "Block 4", start: [16,0],  end: [17,0],  type: "work"   },
    ];

    const TAG_CLASSES = { work:'tag-work', break:'tag-break', warmup:'tag-warmup', lunch:'tag-lunch' };
    const TAG_LABELS  = { work:'Focus', break:'Break', warmup:'Warm up', lunch:'Lunch' };
    const BAR_COLORS  = { work:'#378ADD', break:'#1D9E75', warmup:'#EF9F27', lunch:'#D85A30' };

    function toMins(h, m) { return h * 60 + m; }

    function fmtTime(h, m) {
      const ampm = h < 12 ? 'am' : 'pm';
      const hh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
      return hh + (m > 0 ? ':' + String(m).padStart(2,'0') : '') + ampm;
    }

    function fmtLeft(mins) {
      if (mins <= 0) return 'ending now';
      if (mins >= 60) {
        const h = Math.floor(mins / 60), m = mins % 60;
        return h + 'h' + (m ? ' ' + m + 'm' : '') + ' left';
      }
      return mins + 'm left';
    }

    function renderSchedule() {
      const now = new Date();
      const nowMins = toMins(now.getHours(), now.getMinutes());
      let activeIdx = -1;
      for (let i = 0; i < SCHEDULE.length; i++) {
        const s = SCHEDULE[i];
        if (nowMins >= toMins(...s.start) && nowMins < toMins(...s.end)) { activeIdx = i; break; }
      }

      const header = document.getElementById('sched-header');
      if (activeIdx === -1) {
        const upcoming = SCHEDULE.find(s => toMins(...s.start) > nowMins);
        if (upcoming) {
          const minsUntil = toMins(...upcoming.start) - nowMins;
          header.innerHTML = `<div class="current-phase-name">Before schedule</div>
            <div class="current-time-remaining">${upcoming.name} starts in ${minsUntil}m</div>`;
        } else {
          header.innerHTML = `<div class="current-phase-name">Day complete</div>
            <div class="current-time-remaining">All blocks finished — great work today</div>`;
        }
      } else {
        const s = SCHEDULE[activeIdx];
        const totalMins = toMins(...s.end) - toMins(...s.start);
        const elapsedMins = nowMins - toMins(...s.start);
        const leftMins = toMins(...s.end) - nowMins;
        const pct = Math.min(100, Math.round((elapsedMins / totalMins) * 100));
        const next = SCHEDULE[activeIdx + 1];
        header.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="pulse-dot"></div>
            <div class="current-phase-name">${s.name}</div>
          </div>
          <div class="current-time-remaining">${fmtLeft(leftMins)} &mdash; until ${fmtTime(...s.end)}</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width:${pct}%;background:${BAR_COLORS[s.type]}"></div>
          </div>
          ${next
            ? `<div class="next-up">Next: ${next.name} at ${fmtTime(...next.start)}</div>`
            : `<div class="next-up">Last block of the day</div>`}`;
      }

      const list = document.getElementById('sched-list');
      list.innerHTML = SCHEDULE.map((s, i) => {
        const isPast   = nowMins >= toMins(...s.end);
        const isActive = i === activeIdx;
        const cls = isActive ? 's-active' : (isPast ? 's-past' : '');
        return `<div class="sched-row ${cls}">
          ${isActive
            ? '<div class="pulse-dot"></div>'
            : '<div style="width:8px;flex-shrink:0"></div>'}
          <span class="sched-time">${fmtTime(...s.start)} – ${fmtTime(...s.end)}</span>
          <span class="sched-name">${s.name}</span>
          <span class="sched-tag ${TAG_CLASSES[s.type]}">${TAG_LABELS[s.type]}</span>
        </div>`;
      }).join('');
    }

    renderSchedule();
    setInterval(renderSchedule, 30000);

    /* ── Tabs ── */
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', tab === 'timer' ? i === 0 : i === 1);
      });
      document.getElementById('timer-panel').classList.toggle('active', tab === 'timer');
      document.getElementById('schedule-panel').classList.toggle('active', tab === 'schedule');
    }
  </script>
</body>
</html>
